name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-debug:
    name: Ubuntu Debug
    runs-on: ubuntu-24.04

    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libopenblas-dev \
            liblapack-dev \
            libbenchmark-dev \
            libgtest-dev \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev

      - name: Use minimum supported CMake
        run: |
          python -m pip install "cmake==3.28.3"
          cmake --version
          ctest --version

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUNI20_BUILD_CLI=ON \
            -DUNI20_ENABLE_MPREAL=ON \
            -DUNI20_BLAS_VENDOR=OpenBLAS \
            -DUNI20_BUILD_COMBINED_TESTS=OFF \
            -DUNI20_BUILD_BENCH=OFF \
            -DUNI20_BUILD_ASM=OFF \
            -DUNI20_USE_SYSTEM_TBB=OFF \
            -DUNI20_USE_SYSTEM_FMT=OFF \
            -DUNI20_USE_SYSTEM_BENCHMARK=ON \
            -DUNI20_USE_SYSTEM_GTEST=ON \
            -DUNI20_USE_SYSTEM_NANOBIND=OFF \
            -DUNI20_FETCHCONTENT_SOURCE=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  standard-mdspan:
    name: GCC 16 standard mdspan interop
    runs-on: ubuntu-24.04
    container: gcc:16.2.0

    env:
      OPENBLAS_NUM_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update -y
          apt-get install -y cmake ninja-build libopenblas-dev liblapack-dev libgtest-dev

      - name: Configure standard extents
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DUNI20_BUILD_COMBINED_TESTS=OFF -DUNI20_BUILD_BENCH=OFF \
            -DUNI20_BUILD_PYTHON=OFF -DUNI20_BUILD_EXAMPLES=OFF -DUNI20_BUILD_ASM=OFF \
            -DUNI20_BLAS_VENDOR=OpenBLAS
          grep -qx '#define UNI20_USE_STD_EXTENTS 1' build/src/uni20/config.hpp

      - name: Build and test std::mdspan import
        run: |
          cmake --build build --parallel 2 --target uni20_mdspan_tests uni20_linalg_tests
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R 'NativeMdspanTest\.Import|TensorCopyTest\.ExplicitForeignImport'

  ubuntu-release:
    name: Ubuntu Release
    runs-on: ubuntu-24.04

    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libopenblas-dev \
            liblapack-dev \
            libbenchmark-dev \
            libgtest-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNI20_BLAS_VENDOR=OpenBLAS \
            -DUNI20_BUILD_COMBINED_TESTS=OFF \
            -DUNI20_BUILD_BENCH=OFF \
            -DUNI20_BUILD_ASM=OFF \
            -DUNI20_USE_SYSTEM_TBB=OFF \
            -DUNI20_USE_SYSTEM_FMT=OFF \
            -DUNI20_USE_SYSTEM_BENCHMARK=ON \
            -DUNI20_USE_SYSTEM_GTEST=ON \
            -DUNI20_USE_SYSTEM_NANOBIND=OFF \
            -DUNI20_FETCHCONTENT_SOURCE=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

  ubuntu-mplapack-binary128:
    name: Ubuntu wide scalars (MPLAPACK kernels ${{ matrix.mplapack }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mplapack: ["ON", "OFF"]

    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            libopenblas-dev \
            liblapack-dev \
            libgtest-dev \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUNI20_BLAS_VENDOR=OpenBLAS \
            -DUNI20_BUILD_COMBINED_TESTS=OFF \
            -DUNI20_BUILD_BENCH=OFF \
            -DUNI20_BUILD_ASM=OFF \
            -DUNI20_BUILD_PYTHON=OFF \
            -DUNI20_ENABLE_FLOAT128=ON \
            -DUNI20_ENABLE_FLOAT80=ON \
            -DUNI20_ENABLE_MPREAL=ON \
            -DUNI20_BACKEND_MPLAPACK=${{ matrix.mplapack }} \
            -DUNI20_BUILD_CLI=ON \
            -DUNI20_USE_SYSTEM_MPLAPACK=OFF \
            -DUNI20_USE_SYSTEM_TBB=OFF \
            -DUNI20_USE_SYSTEM_FMT=OFF \
            -DUNI20_USE_SYSTEM_GTEST=ON \
            -DUNI20_FETCHCONTENT_SOURCE=OFF

      - name: Build all targets with optional scalar providers
        run: cmake --build build --parallel 2

      - name: Test complete provider-enabled suite
        run: ctest --test-dir build --output-on-failure

      - name: Test numerical precision matrix
        run: |
          build/tests/numerics/uni20_numerical_precision_tests --gtest_output=xml:build/precision.xml

      - name: Report numerical precision coverage
        if: always()
        run: python3 scripts/report-numerical-precision.py build/precision.xml --output build/precision.md

      - name: Upload numerical precision coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numerical-precision-mplapack-${{ matrix.mplapack }}
          path: |
            build/precision.xml
            build/precision.md

  ubuntu-clang-debug:
    name: Ubuntu Clang 19 Debug
    runs-on: ubuntu-24.04

    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            clang-19 \
            clang-tools-19 \
            libopenblas-dev \
            liblapack-dev \
            libbenchmark-dev \
            libgtest-dev \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev

      - name: Use current CMake 4.x
        run: |
          python -m pip install --upgrade "cmake>=4.2,<5"
          cmake --version
          ctest --version

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-19 \
            -DUNI20_BUILD_CLI=ON \
            -DUNI20_ENABLE_FLOAT80=OFF \
            -DUNI20_ENABLE_MPREAL=ON \
            -DUNI20_BLAS_VENDOR=OpenBLAS \
            -DUNI20_BUILD_COMBINED_TESTS=OFF \
            -DUNI20_BUILD_BENCH=OFF \
            -DUNI20_BUILD_ASM=OFF \
            -DUNI20_USE_SYSTEM_TBB=OFF \
            -DUNI20_USE_SYSTEM_FMT=OFF \
            -DUNI20_USE_SYSTEM_BENCHMARK=ON \
            -DUNI20_USE_SYSTEM_GTEST=ON \
            -DUNI20_USE_SYSTEM_NANOBIND=OFF \
            -DUNI20_FETCHCONTENT_SOURCE=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure
